<article class="relative grid min-w-0 grid-rows-[auto_auto_1fr_auto]">
  <div class="relative grid aspect-square place-items-center overflow-hidden rounded-2xl bg-[#e4f3ea]">
    <span>No photo available</span>
    <img class="absolute inset-0 h-full w-full object-cover" hidden loading="lazy" alt="">
    <small class="condition absolute top-3 left-3 max-w-[85%] truncate rounded-full bg-white px-3 py-1 empty:hidden"></small>
  </div>
  <p class="category eyebrow mt-3 truncate"></p>
  <h3 class="my-1 font-serif text-xl break-words"><a class="after:absolute after:inset-0 hover:underline"></a></h3>
  <div class="grid grid-cols-[auto_1fr] gap-2 border-t border-[#d9ddcf] pt-2 text-sm">
    <p>Current bid<br><strong class="price"></strong></p>
    <p class="text-right">Ends <time></time><br><span class="bid-count"></span></p>
  </div>
</article>
