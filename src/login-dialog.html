<dialog id="login-dialog" aria-labelledby="login-heading" class="m-auto w-[min(92%,32rem)] rounded-3xl bg-[var(--cream)] p-7 text-[var(--forest)] backdrop:bg-black/60 sm:p-12">
  <a href="/" class="brand">loop</a>
  <button type="button" data-close aria-label="Close login" class="absolute top-6 right-7 rounded-full bg-black/5 px-3 py-1 text-xl">×</button>
  <h2 id="login-heading" class="page-title">Welcome back.</h2>
  <p class="mt-2">Log in to bid, list, and manage your profile.</p>
  <form id="login" method="post" class="my-6 grid gap-5">
    <label class="font-semibold">Student email
      <input autofocus name="email" type="email" autocomplete="username" required
        class="mt-1 w-full rounded-xl bg-white border p-3 font-normal" />
    </label>
    <label class="font-semibold">Password
      <input name="password" type="password" autocomplete="current-password" required
        class="mt-1 w-full rounded-xl bg-white border p-3 font-normal" />
    </label>
    <button class="rounded-full bg-[#173d30] p-3 font-semibold text-white disabled:opacity-60">Log in</button>
  </form>
  <p id="login-status" role="status"></p>
  <p class="mt-4">New to Loop? <a href="/register/" class="font-semibold underline">Create account</a></p>
</dialog>
