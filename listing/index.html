<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listing | Loop</title>
  </head>
  <body>
    <a class="sr-only focus:not-sr-only" href="#main">Skip to content</a>
    <header></header>
    <main id="main" tabindex="-1" class="py-10">
      <a href="/browse/" class="underline">← Browse listings</a>
      <p id="status" role="status" class="mt-4">Loading auction…</p>
      <article id="details" hidden>
        <div class="grid items-start gap-8 md:grid-cols-2">
          <div id="photos" class="grid gap-3 rounded-2xl bg-[#e4f3ea] p-3">No photo available</div>
          <div class="min-w-0 space-y-5 break-words">
            <p>Listed by <strong id="seller"></strong></p>
            <h1 id="title" class="font-serif text-4xl"></h1>
            <p id="description" class="whitespace-pre-line"></p>
            <div class="rounded-2xl bg-white p-5">
              <p>Current bid</p>
              <strong id="amount" class="text-2xl"></strong>
              <p class="mt-3"><span id="deadline-label">Ends</span> <time id="deadline"></time></p>
            </div>
            <div id="owner-actions" hidden>
              <button id="edit-listing" class="rounded-full bg-[var(--forest)] px-5 py-2 font-semibold text-white">Edit listing</button>
              <button id="delete-listing" class="ml-3 underline">Delete listing</button>
            </div>
            <dialog id="confirm-delete" aria-labelledby="delete-heading" class="m-auto w-[min(92%,28rem)] rounded-3xl bg-[var(--cream)] p-7 text-[var(--forest)] backdrop:bg-black/50">
              <h2 id="delete-heading" class="font-serif text-3xl">Delete this listing?</h2>
              <p class="my-4">This removes the listing and its bid history. This action cannot be undone.</p>
              <p id="delete-error" role="alert"></p>
              <button id="keep" autofocus class="rounded-full border px-4 py-2">Keep listing</button>
              <button id="remove" class="rounded-full bg-[var(--forest)] px-5 py-2 text-white">Delete</button>
            </dialog>
            <section>
              <h2 class="mb-2 font-serif text-2xl">Bid history</h2>
              <p id="empty">No bids yet.</p>
              <ol id="bids" class="divide-y divide-[#d9ddcf]"></ol>
            </section>
          </div>
        </div>
      </article>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/listing.js"></script>
  </body>
</html>
