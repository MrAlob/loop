<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse listings | Loop</title>
  </head>
  <body>
    <a class="sr-only focus:not-sr-only" href="#main">Skip to content</a>
    <header></header>
    <main id="main" tabindex="-1" class="py-12">
      <p class="eyebrow">Campus marketplace</p>
      <h1 class="page-title">Browse the loop.</h1>
      <div class="mb-5 grid gap-3">
        <label class="grid gap-1 font-semibold" for="keyword">Search listings
          <input id="keyword" type="search" placeholder="Try a bike or a desk lamp"
            class="rounded-full border border-[#d9ddcf] bg-white px-4 py-2 font-normal" />
        </label>
        <div class="flex flex-wrap items-center gap-2">
          <fieldset id="categories" class="filter-row"><legend class="sr-only">Category</legend></fieldset>
          <label class="ml-auto">Sort
            <select id="sort" class="rounded-full bg-white px-3 py-2"><option value="endsAt">Ending soon</option><option value="created">Newest first</option></select>
          </label>
        </div>
      </div>
      <p id="listings-status" role="status">Loading auctions…</p>
      <div id="listings" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/listings.js"></script>
  </body>
</html>
